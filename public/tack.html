<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solicitud enviada — Portal Duplica</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <a class="logo-wrap" href="/" aria-label="Inicio">
        <img src="/mylogo.png" alt="Portal Duplica" class="site-logo" width="200" height="48" decoding="async" onerror="this.onerror=null;this.src='/logo.svg';" />
      </a>

      <div class="form-frame">
        <div class="form-card thank-you-card">
          <div class="thank-you-icon" aria-hidden="true">✓</div>
          <h1 class="form-title">¡Enviado!</h1>
          <p class="thank-you-text">Hemos recibido tu solicitud y te contactaremos lo antes posible.</p>
          <a class="btn-primary thank-you-btn" href="/">Volver al inicio de sesión</a>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <p>© Portal Duplica <span id="year"></span></p>
      <a class="link" href="#">Ayuda</a>
    </footer>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
